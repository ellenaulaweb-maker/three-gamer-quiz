<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THREE GAMER • Professor</title><link rel="stylesheet" href="styles.css"><script src="/socket.io/socket.io.js"></script></head><body><main class="host"><header><img src="assets/three.png"><div><b>THREE <span>GAMER</span></b><small>PAINEL DO PROFESSOR</small></div><button id="newRoom" class="outline">NOVA SALA</button></header><section id="lobby" class="screen"><div class="hero card"><div><div class="eyebrow">ENTRADA DA TURMA</div><h1>Escaneie para entrar</h1><div id="pinDisplay" class="pin">------</div><p id="joinUrl" class="muted">Criando sala...</p><button id="startBtn">INICIAR QUIZ</button><button id="copyBtn" class="secondary">COPIAR LINK</button></div><div class="qr card"><img id="qr"><small>Use a câmera do celular</small></div></div><div class="card"><h2>Alunos conectados <span id="playerCount">0 jogadores</span></h2><div id="playerList" class="players"></div></div></section><section id="play" class="screen hidden"><div class="card"><div class="gamebar"><strong id="hostCategory">HTML</strong><span id="hostCounter">1 / 10</span><span id="hostTimer">20</span></div><div class="meter"><i id="hostTimerFill"></i></div><h1 id="hostQuestion">Pergunta</h1><div id="hostAnswers" class="hostAnswers"></div><div class="row"><span id="answeredCount">0 / 0 responderam</span><button id="nextBtn">RESULTADO</button></div></div><aside class="card"><h2>Ranking ao vivo</h2><div id="ranking"></div></aside></section><section id="review" class="screen hidden"><div class="card"><div class="eyebrow">RESULTADO DA RODADA</div><h1 id="reviewTitle"></h1><p id="reviewExplanation" class="muted"></p><div id="reviewAnswers" class="players"></div><button id="reviewNextBtn">PRÓXIMA</button></div></section><section id="podium" class="screen hidden"><div class="card center"><div class="eyebrow">FIM DA PARTIDA</div><h1>🏆 PÓDIO FINAL</h1><div id="podiumList" class="po
