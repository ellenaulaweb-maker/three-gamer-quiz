<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THREE GAMER • Aluno</title><link rel="stylesheet" href="style.css"><script src="/socket.io/socket.io.js"></script></head><body><main class="student"><header><img src="assets/three.png"><div><b>THREE <span>GAMER</span></b><small>DESAFIO WEB</small></div></header><section id="join" class="card"><div class="eyebrow">ENTRADA DO ALUNO</div><h1>Entre na arena</h1><p>Digite o PIN da sala e escolha um avatar.</p><form id="joinForm"><input id="pin" inputmode="numeric" maxlength="6" placeholder="PIN da sala"><input id="name" maxlength="20" placeholder="Seu nome"><div id="avatars" class="avatars"></div><button>ENTRAR NA SALA →</button><div id="joinError" class="error"></div></form></section><section id="game" class="card hidden"><div class="gamebar"><strong id="category">HTML</strong><span id="counter">1 / 10</span><span><b id="timer">20</b>s</span></div><div class="meter"><i id="timerFill"></i></div><h2 id="questionText"></h2><div id="options" class="options"></div><div id="answerFeedback" class="feedback"></div><div id="score">0 pts</div></section><section id="finish" class="card hidden center"><div class="trophy">🏆</div><div class="eyebrow">DESAFIO CONCLUÍDO</div><h1>Fim da partida!</h1><p id="finishText">Veja o pódio na tela do professor.</p></section></main><script src="script.js"></script></body></html>
